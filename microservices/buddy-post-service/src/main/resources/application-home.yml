spring:
  application:
    name: buddy-administrator-service
  datasource:
    url: jdbc:mysql://localhost:3306/buddy_post_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
#      mode: always
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

minio:
  url: http://localhost:9000
  access-key: arindamss
  secret-key: Arindam2*
  bucket: buddy-media

server:
  address: 0.0.0.0
  port: 8083

eureka:
  instance:
    preferIpAddress: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka