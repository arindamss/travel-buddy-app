version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: arindamss
      MINIO_ROOT_PASSWORD: Arindam2*
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data: